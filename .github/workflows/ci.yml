name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate source tree
        run: ./scripts/validate.sh

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: mediatek
            subtarget: filogic
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDK host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential file gawk gettext git libncurses-dev libssl-dev python3 rsync unzip zstd
      - name: Build APK packages
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist/${{ matrix.arch }}
          BUILD_JOBS: "2"
        run: ./scripts/build.sh
      - name: Upload unsigned CI packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-newt-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.apk
          if-no-files-found: error
          retention-days: 14

